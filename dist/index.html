<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>velyB 국내·글로벌 마케팅</title>
<style>
:root{--navy:#1d2740;--pink:#ff7fa3;--bg:#f5f6f9;--line:#e5e8ef;--muted:#697386}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Pretendard,"Noto Sans KR",sans-serif}header{background:var(--navy);color:white;padding:24px 28px 72px}.top,main,footer{max-width:1320px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:13px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--pink);display:grid;place-items:center;color:var(--navy);font-size:22px;font-weight:900}h1{font-size:25px;margin:0 0 5px}.sub{font-size:14px;color:#bdc6d7}.actions{display:flex;gap:8px}.btn{border:1px solid #ffffff44;background:#ffffff12;color:white;border-radius:10px;padding:10px 13px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer}main{margin-top:-47px;padding:0 22px 48px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #1d274014}.card{padding:20px}.label,.caption{color:var(--muted);font-size:13px}.metric{font-size:27px;font-weight:850;margin-top:8px}.metric small{font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}.panel{padding:21px}.panel h2{font-size:18px;margin:0}.caption{margin:5px 0 18px}.chart{height:270px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:min(38px,74%);height:var(--h);min-height:2px;background:linear-gradient(#ffb2c7,var(--pink));border-radius:7px 7px 2px 2px}.barval{font-size:11px;color:var(--muted)}.month{font-size:12px;color:#536077}.rankrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.no{width:28px;height:28px;border-radius:9px;background:#fff0f4;color:#c9476d;display:grid;place-items:center;font-weight:800}.money{font-weight:800;font-size:14px}.tabs{display:flex;gap:7px;margin:14px 0 10px;overflow:auto}.tab{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;font:inherit;font-size:14px;white-space:nowrap}.tab.active{background:var(--navy);color:white}.tablepanel{padding:0;overflow:hidden}.tablehead{padding:20px 21px 12px}.tablewrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#f2f4f8;text-align:left;font-size:13px;padding:12px 14px}td{font-size:14px;padding:13px 14px;border-top:1px solid #ebedf2;vertical-align:top}.chip{padding:4px 8px;border-radius:99px;background:#e9f6f1;color:#168a68;font-size:12px;font-weight:700}.status{display:none;background:#fff0f0;color:#993d3d;border:1px solid #efcccc;padding:13px 16px;border-radius:12px;margin-bottom:14px}footer{padding:0 22px 30px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.barval{display:none}}@media(max-width:560px){header{padding:20px 18px 68px}.actions a{display:none}main{padding:0 13px 40px}.card{padding:16px}.metric{font-size:21px}h1{font-size:19px}}
.brand-logo{width:112px;height:48px;object-fit:contain}.shell{max-width:1440px;margin:-47px auto 0;padding:0 22px 48px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:18px}.shell main{margin:0;padding:0}.sidebar{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #1d274014;padding:18px 12px;height:max-content;position:sticky;top:16px}.side-title{font-size:12px;font-weight:800;color:#8a93a3;padding:4px 10px 10px}.sidebtn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:10px;color:#465166;font:inherit;font-size:14px;cursor:pointer;margin:2px 0}.sidebtn:hover{background:#f5f6f9}.sidebtn.active{background:var(--navy);color:white;font-weight:700}.side-meta{border-top:1px solid var(--line);margin:18px 8px 0;padding-top:16px;color:var(--muted);font-size:12px}.monthly-note{margin:14px;padding:13px;border-radius:10px;background:#fff7f0;color:#7a6048;font-size:13px}.tabs{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;gap:6px;overflow:auto;padding:9px}.side-title,.side-meta{display:none}.sidebtn{width:auto;white-space:nowrap;padding:10px 12px}.brand-logo{width:92px}}@media(max-width:560px){.shell{padding:0 13px 40px}.brand h1,.brand .sub{display:none}}
.overview-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-top:14px}.donut-wrap{display:grid;grid-template-columns:180px 1fr;align-items:center;gap:16px}.donut{width:170px;height:170px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:42px;border-radius:50%;background:white}.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--muted)}.donut-center b{font-size:20px;color:#172033}.legend{display:grid;gap:11px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}.bottom-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}.hbars{display:grid;gap:12px}.hrow{display:grid;grid-template-columns:110px 1fr 86px;gap:10px;align-items:center;font-size:13px}.htrack{height:13px;border-radius:99px;background:#f1f3f7;overflow:hidden}.hfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb2c7,#ff5f91)}.contract{display:grid;grid-template-columns:1.1fr .7fr .8fr;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}.status-chip{justify-self:start;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.ok{background:#e9f7ef;color:#168a68}.warn{background:#fff2df;color:#b66b12}.check{background:#eef1f5;color:#667085}.tablepanel{margin-top:14px}@media(max-width:1050px){.overview-grid,.bottom-grid{grid-template-columns:1fr}}@media(max-width:620px){.donut-wrap{grid-template-columns:1fr}.hrow{grid-template-columns:82px 1fr 72px}}
</style></head><body>
<header><div class="top"><div class="brand"><img class="brand-logo" src="velyb-logo.svg" alt="velyB"><div><h1>국내·글로벌 마케팅</h1><div class="sub">Google Sheets 자동 연동</div></div></div><div class="actions"><a class="btn" href="https://docs.google.com/spreadsheets/d/1cN7YKgH6yaiEGx78Lrk6VrBeeupZVx_NxuSbOtFfbdY/edit" target="_blank">구글시트 열기</a><button class="btn" id="refresh">새로고침</button></div></div></header>
<div class="shell"><aside class="sidebar"><div class="side-title">MENU</div><button class="sidebtn active" data-scroll="summary">전체 요약</button><button class="sidebtn" data-scroll="monthly">월별 광고비</button><button class="sidebtn" data-view="ads">광고비 내역</button><button class="sidebtn" data-view="fixed">지점별 고정비</button><button class="sidebtn" data-view="fees">수수료</button><button class="sidebtn" data-view="agency">에이전시 현황</button><div class="side-meta">구글시트 수정 내용은<br>5분마다 자동 반영됩니다.</div></aside><main><div class="status" id="status"></div><section class="cards" id="summary">
<article class="card"><div class="label">2026년 누적 광고비</div><div class="metric" id="total">-</div></article>
<article class="card"><div class="label">광고비 집행 내역</div><div class="metric" id="adcount">-</div></article>
<article class="card"><div class="label">등록 에이전시</div><div class="metric" id="agencycount">-</div></article>
<article class="card"><div class="label">수수료 정책</div><div class="metric" id="feecount">-</div></article></section>
<section class="overview-grid" id="monthly"><article class="panel"><h2>월별 광고비 추이</h2><div class="caption">집행액 기준 · 단위 백만원</div><div class="chart" id="chart"></div></article><article class="panel"><h2>권역별 에이전시 비중</h2><div class="caption">등록 에이전시 기준</div><div class="donut-wrap"><div class="donut" id="donut"><div class="donut-center">등록 에이전시<b id="donutTotal">-</b></div></div><div class="legend" id="regionLegend"></div></div></article></section>
<section class="bottom-grid"><article class="panel"><h2>지점별 고정비 비교</h2><div class="caption">월 고정비 합계 · 변동 비용 제외</div><div class="hbars" id="branchBars"></div></article><article class="panel"><h2>에이전시 계약 현황</h2><div class="caption">종료일 기준 확인이 필요한 계약 표시</div><div id="agencyStatus"></div></article></section>
<nav class="tabs"><button class="tab active" data-view="agency">에이전시 현황</button><button class="tab" data-view="ads">광고비 내역</button><button class="tab" data-view="fixed">지점별 고정비</button><button class="tab" data-view="fees">수수료</button></nav>
<section class="panel tablepanel"><div class="tablehead"><h2 id="tabletitle">에이전시 현황</h2><div class="caption" id="tablecaption"></div></div><div class="tablewrap" id="table"></div></section></main></div>
<footer><span id="updated">Google Sheets 연결 중</span><span>전체 공개</span></footer>
<script>
const ID='1cN7YKgH6yaiEGx78Lrk6VrBeeupZVx_NxuSbOtFfbdY',fmt=new Intl.NumberFormat('ko-KR');let D={},current='agency';
async function tab(name){const u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json&headers=1&range=A3:Z&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;const t=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()});const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),h=j.table.cols.map((c,i)=>c.label||`열${i+1}`);return j.table.rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r.c?.[i]?.v??'']))).filter(r=>Object.values(r).some(Boolean))}
async function load(){const s=document.querySelector('#status');s.style.display='none';try{const [summary,months,ads,fixed,fees,agency]=await Promise.all(['대시보드 요약','월별 요약','광고비 내역','지점별 고정비','수수료','에이전시 현황'].map(tab));D={summary,months:months.filter(r=>String(r['월']).includes('월')),ads,fixed,fees,agency};const x=summary[0]||{};metric('total',x['총 광고비']||0,'원');metric('adcount',x['등록 건수']||ads.length,'건');metric('agencycount',x['진행 업체 수']||agency.length,'개');metric('feecount',x['수수료 등록']||fees.length,'건');chart();visuals();table(current);document.querySelector('#updated').textContent='마지막 반영 '+new Date().toLocaleString('ko-KR')}catch(e){s.textContent='데이터를 불러오지 못했습니다. 구글시트 공유 설정을 확인해주세요.';s.style.display='block';document.querySelector('#updated').textContent='Google Sheets 연결 필요'}}
function metric(id,n,u){document.querySelector('#'+id).innerHTML=fmt.format(Number(n))+`<small> ${u}</small>`}
function chart(){const m=Math.max(...D.months.map(r=>+r['광고비(원)']),1);document.querySelector('#chart').innerHTML=D.months.map(r=>{let n=+r['광고비(원)'];return `<div class="barcol"><div class="barval">${(n/1e6).toFixed(1)}</div><div class="bar" style="--h:${Math.max(n/m*100,1)}%"></div><div class="month">${r['월']}</div></div>`}).join('')}
function visuals(){const colors=['#ef5b8f','#f49ab6','#98a2b3','#344054'];const groups={중화권:0,日本:0,국내:0,영어권:0};D.agency.forEach(r=>{const c=String(r['국가']||'');if(c.includes('중국')||c.includes('대만'))groups['중화권']++;else if(c.includes('일본'))groups['日本']++;else if(c.includes('국내'))groups['국내']++;else groups['영어권']++});const entries=Object.entries(groups).filter(x=>x[1]),total=entries.reduce((a,x)=>a+x[1],0)||1;let at=0,stops=[];entries.forEach(([k,n],i)=>{const p=n/total*100;stops.push(`${colors[i]} ${at}% ${at+p}%`);at+=p});document.querySelector('#donut').style.background=`conic-gradient(${stops.join(',')})`;document.querySelector('#donutTotal').textContent=total+'개';document.querySelector('#regionLegend').innerHTML=entries.map(([k,n],i)=>`<div class="legend-row"><span class="dot" style="background:${colors[i]}"></span><span>${k==='日本'?'일본':k}</span><b>${n}개 · ${Math.round(n/total*100)}%</b></div>`).join('');const sums={};D.fixed.forEach(r=>{if(typeof r['월 비용(원)']==='number'){const b=r['지점']||'공통';sums[b]=(sums[b]||0)+r['월 비용(원)']}});const branches=Object.entries(sums).sort((a,b)=>b[1]-a[1]).slice(0,6),max=Math.max(...branches.map(x=>x[1]),1);document.querySelector('#branchBars').innerHTML=branches.map(([b,n])=>`<div class="hrow"><span>${b.length>12?b.slice(0,12)+'…':b}</span><div class="htrack"><div class="hfill" style="width:${n/max*100}%"></div></div><b>${(n/1e6).toFixed(1)}M</b></div>`).join('');const today=new Date('2026-09-11');document.querySelector('#agencyStatus').innerHTML=D.agency.slice(0,6).map(r=>{const raw=r['계약 종료일'],d=raw?new Date(raw):null,days=d?Math.ceil((d-today)/86400000):null;let text='정기 갱신',cl='check';if(days!==null&&days<0){text='기간 확인';cl='check'}else if(days!==null&&days<=60){text='만료 임박';cl='warn'}else if(days!==null){text='진행';cl='ok'}return `<div class="contract"><b>${r['업체명']||'-'}</b><span>${r['국가']||'-'}</span><span class="status-chip ${cl}">${text}</span></div>`}).join('')}
const V={agency:['에이전시 현황','국가·지점·플랫폼·계약 현황',['업체명','국가','해당지점','플랫폼','업무','유치 수수료','계약 종료일']],ads:['광고비 내역','월별 광고비 집행 원천 데이터',['월','항목','거래처','금액(원)','출처']],fixed:['지점별 고정비','지점별 월 고정비 및 예산',['지점','구분','세부항목','월 비용(원)','비고']],fees:['수수료','지점·업체별 수수료 정책',['지점','제휴/업체','수수료 표시','적용 구분','대상권역','비고']]};
function table(v){current=v;const [title,cap,cols]=V[v],rows=D[v]||[];document.querySelector('#tabletitle').textContent=v==='fixed'?'2026년 지점별 월 고정비':title;document.querySelector('#tablecaption').textContent=v==='fixed'?'월 비용 기준 · 변동 항목은 별도 표시':cap;if(v==='fixed'){const sums={},variable=[];rows.forEach(r=>{const branch=r['지점']||'공통',cost=r['월 비용(원)'];if(typeof cost==='number')sums[branch]=(sums[branch]||0)+cost;else if(cost)variable.push((r['세부항목']||'변동 비용')+' ('+cost+')')});const months=Array.from({length:12},(_,i)=>(i+1)+'월');document.querySelector('#table').innerHTML=`<table><thead><tr><th>지점</th><th>월 고정비</th>${months.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${Object.entries(sums).map(([b,n])=>`<tr><td><b>${b}</b></td><td><b>${fmt.format(n)}원</b></td>${months.map(()=>`<td>${fmt.format(n)}원</td>`).join('')}</tr>`).join('')}</tbody></table>`+(variable.length?`<div class="monthly-note"><b>변동 항목</b> · ${variable.join(', ')}</div>`:'');return}document.querySelector('#table').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>{let x=r[c]??'';if((c.includes('금액')||c.includes('비용'))&&typeof x==='number')x=fmt.format(x)+'원';if(c==='유치 수수료'&&x)x=`<span class="chip">${x}</span>`;return `<td>${x}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sidebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');table(b.dataset.view);document.querySelector('#tabletitle').scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sidebtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.scroll).scrollIntoView({behavior:'smooth',block:'start'})});document.querySelector('#refresh').onclick=load;load();setInterval(load,300000);
</script></body></html>
