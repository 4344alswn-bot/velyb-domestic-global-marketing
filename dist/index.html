<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>velyB 국내·글로벌 마케팅 대시보드</title>
<style>
:root{--navy:#1d2740;--pink:#ff7fa3;--bg:#f5f6f9;--line:#e5e8ef;--muted:#697386}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Pretendard,"Noto Sans KR",sans-serif}header{background:var(--navy);color:white;padding:24px 28px 72px}.top,main,footer{max-width:1320px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:13px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--pink);display:grid;place-items:center;color:var(--navy);font-size:22px;font-weight:900}h1{font-size:25px;margin:0 0 5px}.sub{font-size:14px;color:#bdc6d7}.actions{display:flex;gap:8px}.btn{border:1px solid #ffffff44;background:#ffffff12;color:white;border-radius:10px;padding:10px 13px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer}main{margin-top:-47px;padding:0 22px 48px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px #1d274014}.card{padding:20px}.label,.caption{color:var(--muted);font-size:13px}.metric{font-size:27px;font-weight:850;margin-top:8px}.metric small{font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-top:14px}.panel{padding:21px}.panel h2{font-size:18px;margin:0}.caption{margin:5px 0 18px}.chart{height:270px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}.barcol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:min(38px,74%);height:var(--h);min-height:2px;background:linear-gradient(#ffb2c7,var(--pink));border-radius:7px 7px 2px 2px}.barval{font-size:11px;color:var(--muted)}.month{font-size:12px;color:#536077}.rankrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.no{width:28px;height:28px;border-radius:9px;background:#fff0f4;color:#c9476d;display:grid;place-items:center;font-weight:800}.money{font-weight:800;font-size:14px}.tabs{display:flex;gap:7px;margin:14px 0 10px;overflow:auto}.tab{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;font:inherit;font-size:14px;white-space:nowrap}.tab.active{background:var(--navy);color:white}.tablepanel{padding:0;overflow:hidden}.tablehead{padding:20px 21px 12px}.tablewrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#f2f4f8;text-align:left;font-size:13px;padding:12px 14px}td{font-size:14px;padding:13px 14px;border-top:1px solid #ebedf2;vertical-align:top}.chip{padding:4px 8px;border-radius:99px;background:#e9f6f1;color:#168a68;font-size:12px;font-weight:700}.status{display:none;background:#fff0f0;color:#993d3d;border:1px solid #efcccc;padding:13px 16px;border-radius:12px;margin-bottom:14px}footer{padding:0 22px 30px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.barval{display:none}}@media(max-width:560px){header{padding:20px 18px 68px}.actions a{display:none}main{padding:0 13px 40px}.card{padding:16px}.metric{font-size:21px}h1{font-size:19px}}
</style></head><body>
<header><div class="top"><div class="brand"><div class="logo">B</div><div><h1>국내·글로벌 마케팅 대시보드</h1><div class="sub">velyB 마케팅 운영 현황</div></div></div><div class="actions"><a class="btn" href="https://docs.google.com/spreadsheets/d/1cN7YKgH6yaiEGx78Lrk6VrBeeupZVx_NxuSbOtFfbdY/edit" target="_blank">구글시트 열기</a><button class="btn" id="refresh">새로고침</button></div></div></header>
<main><div class="status" id="status"></div><section class="cards">
<article class="card"><div class="label">2026년 누적 광고비</div><div class="metric" id="total">-</div></article>
<article class="card"><div class="label">광고비 집행 내역</div><div class="metric" id="adcount">-</div></article>
<article class="card"><div class="label">등록 에이전시</div><div class="metric" id="agencycount">-</div></article>
<article class="card"><div class="label">수수료 정책</div><div class="metric" id="feecount">-</div></article></section>
<section class="grid"><article class="panel"><h2>월별 광고비</h2><div class="caption">구글시트 실시간 반영 · 단위 백만원</div><div class="chart" id="chart"></div></article><article class="panel"><h2>광고비 상위 월</h2><div class="caption">누적 집행액 기준</div><div id="ranking"></div></article></section>
<nav class="tabs"><button class="tab active" data-view="agency">에이전시 현황</button><button class="tab" data-view="ads">광고비 내역</button><button class="tab" data-view="fixed">지점별 고정비</button><button class="tab" data-view="fees">수수료</button></nav>
<section class="panel tablepanel"><div class="tablehead"><h2 id="tabletitle">에이전시 현황</h2><div class="caption" id="tablecaption"></div></div><div class="tablewrap" id="table"></div></section></main>
<footer><span id="updated">Google Sheets 연결 중</span><span>전체 공개</span></footer>
<script>
const ID='1cN7YKgH6yaiEGx78Lrk6VrBeeupZVx_NxuSbOtFfbdY',fmt=new Intl.NumberFormat('ko-KR');let D={},current='agency';
async function tab(name){const u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json&headers=1&range=A3:Z&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;const t=await fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()});const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1)),h=j.table.cols.map((c,i)=>c.label||`열${i+1}`);return j.table.rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r.c?.[i]?.v??'']))).filter(r=>Object.values(r).some(Boolean))}
async function load(){const s=document.querySelector('#status');s.style.display='none';try{const [summary,months,ads,fixed,fees,agency]=await Promise.all(['대시보드 요약','월별 요약','광고비 내역','지점별 고정비','수수료','에이전시 현황'].map(tab));D={summary,months:months.filter(r=>String(r['월']).includes('월')),ads,fixed,fees,agency};const x=summary[0]||{};metric('total',x['총 광고비']||0,'원');metric('adcount',x['등록 건수']||ads.length,'건');metric('agencycount',x['진행 업체 수']||agency.length,'개');metric('feecount',x['수수료 등록']||fees.length,'건');chart();table(current);document.querySelector('#updated').textContent='마지막 반영 '+new Date().toLocaleString('ko-KR')}catch(e){s.textContent='구글시트 공유 설정을 “링크가 있는 모든 사용자: 뷰어”로 변경해주세요.';s.style.display='block';document.querySelector('#updated').textContent='Google Sheets 연결 필요'}}
function metric(id,n,u){document.querySelector('#'+id).innerHTML=fmt.format(Number(n))+`<small> ${u}</small>`}
function chart(){const m=Math.max(...D.months.map(r=>+r['광고비(원)']),1);document.querySelector('#chart').innerHTML=D.months.map(r=>{let n=+r['광고비(원)'];return `<div class="barcol"><div class="barval">${(n/1e6).toFixed(1)}</div><div class="bar" style="--h:${Math.max(n/m*100,1)}%"></div><div class="month">${r['월']}</div></div>`}).join('');document.querySelector('#ranking').innerHTML=[...D.months].sort((a,b)=>b['광고비(원)']-a['광고비(원)']).slice(0,4).map((r,i)=>`<div class="rankrow"><div class="no">${i+1}</div><div><b>${r['월']}</b><div class="caption">${r['집행 건수']||0}건 집행</div></div><div class="money">${fmt.format(r['광고비(원)'])}원</div></div>`).join('')}
const V={agency:['에이전시 현황','국가·지점·플랫폼·계약 현황',['업체명','국가','해당지점','플랫폼','업무','유치 수수료','계약 종료일']],ads:['광고비 내역','월별 광고비 집행 원천 데이터',['월','항목','거래처','금액(원)','출처']],fixed:['지점별 고정비','지점별 월 고정비 및 예산',['지점','구분','세부항목','월 비용(원)','비고']],fees:['수수료','지점·업체별 수수료 정책',['지점','제휴/업체','수수료 표시','적용 구분','대상권역','비고']]};
function table(v){current=v;const [title,cap,cols]=V[v],rows=D[v]||[];document.querySelector('#tabletitle').textContent=title;document.querySelector('#tablecaption').textContent=cap;document.querySelector('#table').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>{let x=r[c]??'';if((c.includes('금액')||c.includes('비용'))&&typeof x==='number')x=fmt.format(x)+'원';if(c==='유치 수수료'&&x)x=`<span class="chip">${x}</span>`;return `<td>${x}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');table(b.dataset.view)});document.querySelector('#refresh').onclick=load;load();setInterval(load,300000);
</script></body></html>
